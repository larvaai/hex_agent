features:
  example_echo:
    enabled: true
    module: features.example_echo
  llm_chat:
    enabled: true
    module: features.llm_chat
  toolbox:
    enabled: true
    module: toolbox.feature
  rag:
    enabled: true
    module: rag.feature

# RAG backend. Default 'memory' (offline, no docker) keeps the default kernel
# self-contained. Switch to 'qdrant' once Qdrant is up (docker-compose.rag.yml)
# and the optional deps are installed: pip install -e ".[rag]".
rag:
  backend: memory
  collection: agent_kb
  score_threshold: 0.8
  top_k: 5
  # model: BAAI/bge-small-en-v1.5   # used by the qdrant backend (fastembed)
  # qdrant_url: http://127.0.0.1:6333

delegation:
  enabled: true
  default_target: agent:general
