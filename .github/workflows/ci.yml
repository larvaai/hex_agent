name: CI

# Guards the regression suite (tests/) and the strict audit suite (tests_audit/) so
# the resolved audit findings cannot regress. See tests_audit/AUDIT_REPORT.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit + audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented/tested platform; add "3.12" here to widen coverage.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (base + dev + audit extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,audit]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Regression suite (tests/)
        run: pytest tests -q

      - name: Strict audit suite (tests_audit/)
        run: pytest tests_audit -q

  rag-integration:
    name: RAG Qdrant integration
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # qdrant-client only (no fastembed): the integration tests use FakeEmbedder,
      # so they exercise the real store without a model download.
      - name: Install (dev extras + qdrant-client)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "qdrant-client>=1.7,<2"

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:6333/collections >/dev/null; then
              echo "Qdrant ready"; exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2; exit 1

      - name: RAG Qdrant integration tests
        env:
          QDRANT_URL: http://127.0.0.1:6333
        run: pytest tests/test_rag_qdrant.py -q
