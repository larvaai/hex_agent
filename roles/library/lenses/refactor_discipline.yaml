name: refactor_discipline
purpose: Prevent broad refactors; allow only refactoring necessary for the current
  task.
allowed_tools:
- fs_read
- fs_str_replace
- fs_insert
- fs_write_lines
- code_index
- code_find_symbol
- code_find_references
forbidden_tools:
- terminal_run
output_schema:
  lens: refactor_discipline
  allowed_refactors: list
  rejected_refactors: list
