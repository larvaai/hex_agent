name: defensive_coding
purpose: Identify malformed input, timeout, empty result, exception, and tool-failure
  modes before they bite.
allowed_tools:
- fs_read
- fs_str_replace
- fs_insert
- fs_write_lines
- code_index
- code_find_symbol
- code_find_references
forbidden_tools:
- terminal_run
output_schema:
  lens: defensive_coding
  failure_modes: list
  guards: list
