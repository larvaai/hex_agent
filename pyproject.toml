[project]
name = "core_agent"
version = "0.0.1"
description = "Clean rebuild of the agent system — Sprint 0 (kernel, discipline, llm adapter, observability)."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.6,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "openai>=1.0",
    "PyYAML>=6.0",
]

[project.scripts]
core-agent-ui = "ui.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
audit = ["hypothesis>=6", "pytest-cov>=5", "pytest-timeout>=2"]
# RAG (E08) production backend — kept out of the base install; the default
# 'memory' backend needs none of these. Install with: pip install -e ".[rag]".
rag = ["qdrant-client>=1.7,<2", "fastembed>=0.3"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "audit: exhaustive audit-suite test",
    "property: Hypothesis/property-based test",
    "security: adversarial security-boundary test",
    "concurrency: multi-thread/process consistency test",
    "integration: crosses multiple production components",
]

[tool.setuptools.packages.find]
include = [
    "adapters*",
    "core*",
    "delegation*",
    "discipline*",
    "features*",
    "graph*",
    "llm*",
    "middleware*",
    "observability*",
    "orchestrator*",
    "rag*",
    "roles*",
    "safety*",
    "skills*",
    "supervisor*",
    "toolbox*",
    "ui*",
]
